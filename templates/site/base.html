<!doctype html>
<html lang="{{ language|default('en') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.meta.description if page is defined and page.meta is defined else site.description }}">
    <meta name="theme-color" content="#151619">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='site/images/icon.png') }}">
    <title>{{ page.meta.title if page is defined and page.meta is defined else site.full_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='site/css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site/css/site.css') }}">
    {% if active_page == 'research' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='site/css/research.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap">
    {% endif %}
  </head>
  <body class="page page--{{ active_page|default('home') }}">
    <a class="skip-link" href="#main-content">{{ ui.skip_to_content }}</a>
    {% include 'site/partials/header.html' %}
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    {% include 'site/partials/footer.html' %}
    <script src="{{ url_for('static', filename='site/js/site.js') }}" defer></script>
    {% if active_page == 'research' %}<script src="{{ url_for('static', filename='site/js/research.js') }}" defer></script>{% endif %}
  </body>
</html>
