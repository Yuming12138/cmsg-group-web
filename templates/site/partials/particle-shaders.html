<script id="snoise-src" type="x-shader/x-fragment">
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
</script>

<script id="sim-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uPosition;
uniform sampler2D uPosRefs;
uniform vec2 uRingPos;
uniform float uTime;
uniform float uDeltaTime;
uniform float uRingRadius;
uniform float uRingWidth;
uniform float uRingWidth2;
uniform float uRingDisplacement;
out vec4 outColor;

/*__SNOISE__*/

void main() {
  vec2 simTexCoords = gl_FragCoord.xy / vec2(256.0, 256.0);
  vec4 pFrame = texture(uPosition, simTexCoords);
  float sc = pFrame.z;
  float vel = pFrame.w;
  vec2 refPos = texture(uPosRefs, simTexCoords).xy;

  float time = uTime * .5;
  vec2 curentPos = refPos;
  vec2 pos = pFrame.xy;
  pos *= .8;

  float dist = distance(curentPos.xy, uRingPos);
  float noise0 = snoise(vec3(curentPos.xy * .2 + vec2(18.4924, 72.9744), time * 0.5));
  float dist1 = distance(curentPos.xy + (noise0 * .005), uRingPos);

  float tA = smoothstep(uRingRadius - (uRingWidth * 2.), uRingRadius, dist) - smoothstep(uRingRadius, uRingRadius + uRingWidth, dist1);
  float t2 = smoothstep(uRingRadius - (uRingWidth2 * 2.), uRingRadius, dist) - smoothstep(uRingRadius, uRingRadius + uRingWidth2, dist1);
  float t3 = smoothstep(uRingRadius + uRingWidth2, uRingRadius, dist);

  float tBand = pow(max(tA, 0.0), 2.);
  t2 = pow(max(t2, 0.0), 3.);

  float nS = snoise(vec3(curentPos.xy * 2. + vec2(18.4924, 72.9744), time * 0.5));

  float t = tBand + t2 * 3. + t3 * .4 + snoise(vec3(curentPos.xy * 30. + vec2(11.4924, 12.9744), time * 0.5)) * t3 * .5 + pow((nS + 1.5) * .5, 2.) * .6;

  float noise1 = snoise(vec3(curentPos.xy * 4. + vec2(88.494, 32.4397), time * 0.35));
  float noise2 = snoise(vec3(curentPos.xy * 4. + vec2(50.904, 120.947), time * 0.35));
  float noise3 = snoise(vec3(curentPos.xy * 20. + vec2(18.4924, 72.9744), time * .5));
  float noise4 = snoise(vec3(curentPos.xy * 20. + vec2(50.904, 120.947), time * .5));

  vec2 disp = vec2(noise1, noise2) * .03;
  disp += vec2(noise3, noise4) * .005;

  disp.x += sin((refPos.x * 20.) + (time * 4.)) * .02 * clamp(dist, 0., 1.);
  disp.y += cos((refPos.y * 20.) + (time * 3.)) * .02 * clamp(dist, 0., 1.);

  pos -= (uRingPos - (curentPos + disp)) * pow(max(t2, 0.0), .75) * uRingDisplacement;

  float scaleDiff = t - sc;
  scaleDiff *= .2;
  sc += scaleDiff;
  sc = min(max(sc, 0.0), 8.0);

  vec2 finalPos = curentPos + disp + (pos * .25);
  finalPos = clamp(finalPos, vec2(-4.0), vec2(4.0));

  vel *= .5;
  vel += sc * .25;

  outColor = vec4(finalPos, sc, vel);
}
</script>

<script id="render-vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
in vec2 aUV;
uniform sampler2D uPosition;
uniform float uParticleScale;
uniform float uPixelRatio;
uniform float uAspect;
out float vVelocity;
out vec2 vLocalPos;
out float vScale;

void main() {
  vec4 pos = texture(uPosition, aUV);
  vVelocity = pos.w;
  vScale = pos.z;
  vLocalPos = pos.xy;

  vec2 world = pos.xy * 5.0;
  float ndcX = world.x * 2.74747742 / uAspect / 3.1;
  float ndcY = world.y * 2.74747742 / 3.1;
  gl_Position = vec4(ndcX, ndcY, 0.0, 1.0);

  gl_PointSize = ((vScale * 7.) * (uPixelRatio * 0.5) * uParticleScale);
}
</script>

<script id="render-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vLocalPos;
in float vScale;
in float vVelocity;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
uniform vec2 uRingPos;
uniform float uAlpha;
uniform float uTime;
out vec4 outColor;

/*__SNOISE__*/

float sdRoundBox(in vec2 p, in vec2 b, in vec4 r) {
  r.xy = (p.x > 0.0) ? r.xy : r.zw;
  r.x  = (p.y > 0.0) ? r.x  : r.y;
  vec2 q = abs(p) - b + r.x;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r.x;
}

vec2 rotate2d(vec2 v, float a) {
  float s = sin(a);
  float c = cos(a);
  mat2 m = mat2(c, s, -s, c);
  return m * v;
}

vec3 sRGBOETF(vec3 c) {
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

void main() {
  float noiseAngle = snoise(vec3(vLocalPos * 10. + vec2(18.4924, 72.9744), uTime * .85));
  float noiseColor = snoise(vec3(vLocalPos * 2. + vec2(74.664, 91.556), uTime * .5));
  noiseColor = (noiseColor + 1.) * .5;

  float angle = atan(vLocalPos.y - uRingPos.y, vLocalPos.x - uRingPos.x);

  vec2 uv = gl_PointCoord.xy;
  uv -= vec2(0.5);
  uv.y *= -1.;
  uv = rotate2d(uv, -angle + (noiseAngle * .5));

  float h = 0.8;
  float progress = smoothstep(0., .75, pow(noiseColor, 2.));
  vec3 col = mix(mix(uColor1, uColor2, progress / h), mix(uColor2, uColor3, (progress - h) / (1.0 - h)), step(h, progress));
  vec3 color = col;

  float rounded = sdRoundBox(uv, vec2(0.5, 0.2), vec4(.25));
  rounded = smoothstep(.1, 0., rounded);

  float a = uAlpha * rounded * smoothstep(0.1, 0.2, vScale);
  if (a < 0.01) discard;

  color = clamp(color, 0., 1.);
  color = color * clamp(vVelocity, 0., 1.);

  vec4 frag = vec4(color, clamp(a, 0., 1.));
  outColor = vec4(sRGBOETF(clamp(frag.rgb, 0.0, 1.0)), frag.a);
}
</script>
