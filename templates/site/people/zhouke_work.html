{% extends 'site/base.html' %}

{% block head_extra %}
    <link rel="stylesheet" href="{{ asset('site/css/zhouke.css') }}">
    {% if work_id == 5 %}
    <link rel="stylesheet" href="{{ asset('site/css/zhouke-work-5.css') }}">
    <link rel="canonical" href="https://www.comates.group/people/zhouke/work/5">
    <meta property="og:title" content="{{ work.meta.title }}">
    <meta property="og:description" content="{{ work.meta.description }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://www.comates.group/people/zhouke/work/5">
    <meta property="og:image" content="https://www.comates.group/static/images/members/zhouke/work_5/jacs-article.png">
    <meta property="og:image:secure_url" content="https://www.comates.group/static/images/members/zhouke/work_5/jacs-article.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="JACS论文刊头、标题、作者与摘要">
    <meta property="og:locale" content="zh_CN">
    <meta itemprop="name" content="{{ work.meta.title }}">
    <meta itemprop="description" content="{{ work.meta.description }}">
    <meta itemprop="image" content="https://www.comates.group/static/images/members/zhouke/work_5/jacs-article.png">
    <link rel="image_src" href="https://www.comates.group/static/images/members/zhouke/work_5/jacs-article.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ work.meta.title }}">
    <meta name="twitter:description" content="{{ work.meta.description }}">
    <meta name="twitter:image" content="https://www.comates.group/static/images/members/zhouke/work_5/jacs-article.png">
    <meta name="citation_title" content="The Shear-Bond Descriptor and Universal Machine-Learning Potential Enable Large-Scale Discovery of Negative Thermal Expansion Materials">
    <meta name="citation_journal_title" content="Journal of the American Chemical Society">
    <meta name="citation_doi" content="10.1021/jacs.6c07432">
    {% endif %}
{% endblock %}

{% block content %}
<div class="zhouke-work-page">
  {% include 'site/people/zhouke/_work_' ~ work_id ~ '.html' %}
</div>
{% endblock %}

{% block scripts_extra %}
{% if work_id != 5 %}
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
{% endif %}
{% endblock %}
